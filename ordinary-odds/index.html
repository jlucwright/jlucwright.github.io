<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Privacy information for the Ordinary Odds iPhone app.">
    <title>Ordinary Odds</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17191d; background: #f7f7f4; }
      body { margin: 0; }
      main { box-sizing: border-box; width: min(680px, 100%); min-height: 100vh; margin: 0 auto; padding: 72px 24px; }
      h1 { margin: 0 0 18px; font-family: Georgia, serif; font-size: clamp(2.5rem, 9vw, 4.5rem); font-weight: 600; line-height: 0.95; }
      p { max-width: 580px; margin: 0 0 28px; color: #5d626b; font-size: 1.05rem; line-height: 1.6; }
      a { color: #176b54; font-weight: 650; text-underline-offset: 4px; }
      .label { margin-bottom: 28px; color: #9b682e; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Ordinary Odds</div>
      <h1>Private questions.<br>Private answers.</h1>
      <p>Ordinary Odds turns questions about everyday life into a personal portrait. Your answers stay on your iPhone.</p>
      <a href="privacy/">Read the privacy policy</a>
    </main>
  </body>
